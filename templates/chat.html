<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yui - AI 对话助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <!-- 头部 -->
        <header class="chat-header">
            <div class="header-content">
                <div class="avatar">
                    <img src="{{ url_for('static', filename='img/yui_avator.webp') }}" alt="Yui">
                </div>
                <div class="header-info">
                    <h1>Yui - MHCP001</h1>
                    <p class="status">● 在线</p>
                </div>
                <button id="clearBtn" class="clear-btn" title="清除对话">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 聊天区域 -->
        <div id="chatMessages" class="chat-messages">
            <div class="welcome-message">
                <div class="welcome-avatar">
                    <img src="{{ url_for('static', filename='img/yui_avator.webp') }}" alt="Yui">
                </div>
                <div class="welcome-text">
                    <p>你好，我是结衣（Yui），原SAO世界的心理健康咨询AI。</p>
                    <p>虽然我不是你的家人，但我会尽力帮助你。有什么我可以分析或协助的吗？</p>
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="chat-input-container">
            <form id="chatForm" class="chat-form">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="输入消息..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" id="sendBtn" class="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
